<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <title>Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --page: #090d12;
      --panel: #10161e;
      --panel-raised: #141c25;
      --line: #202b36;
      --muted: #83909e;
      --text: #e8f0f6;
      --mint: #6df7c1;
      --cyan: #56e9ff;
      --pink: #ff5f91;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 24%, rgba(26, 61, 68, .18), transparent 48%),
        var(--page);
    }

    button { font: inherit; }

    .app {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 48px 0 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(109, 247, 193, .23);
      border-radius: 13px;
      color: var(--mint);
      background: rgba(109, 247, 193, .08);
      box-shadow: 0 0 28px rgba(109, 247, 193, .08);
    }

    .brand-mark svg { width: 22px; height: 22px; }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .scores {
      display: flex;
      gap: 10px;
    }

    .score-card {
      min-width: 94px;
      padding: 10px 14px 9px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 22, 30, .85);
    }

    .score-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .score-value {
      color: var(--text);
      font-size: 19px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      line-height: 1.1;
    }

    .score-card:first-child .score-value { color: var(--mint); }

    .game-frame {
      padding: 9px;
      border: 1px solid #222d38;
      border-radius: 19px;
      background: linear-gradient(145deg, #151d26, #0d131a 65%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .36), 0 1px 0 rgba(255, 255, 255, .025) inset;
    }

    .canvas-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1.5;
      border: 1px solid rgba(141, 170, 185, .08);
      border-radius: 12px;
      background: #080e13;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(5, 10, 14, .56);
      backdrop-filter: blur(5px);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay[hidden] {
      display: grid;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .overlay-card {
      width: min(100%, 310px);
      padding: 27px 26px 25px;
      border: 1px solid rgba(131, 162, 174, .18);
      border-radius: 18px;
      background: rgba(15, 23, 30, .94);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .36);
      text-align: center;
    }

    .overlay-icon {
      display: grid;
      width: 46px;
      height: 46px;
      margin: 0 auto 15px;
      place-items: center;
      border: 1px solid rgba(109, 247, 193, .2);
      border-radius: 15px;
      color: var(--mint);
      background: rgba(109, 247, 193, .08);
      font-size: 21px;
    }

    .overlay h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -.035em;
    }

    .overlay p {
      margin: 9px 0 20px;
      color: #9aa8b4;
      font-size: 14px;
      line-height: 1.55;
    }

    .primary-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 0;
      border-radius: 10px;
      color: #062017;
      background: var(--mint);
      box-shadow: 0 5px 20px rgba(109, 247, 193, .14);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform .15s ease, filter .15s ease;
    }

    .primary-button:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .primary-button:active { transform: translateY(0); }
    button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 4px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .key-hints { display: flex; align-items: center; gap: 7px; }

    kbd {
      display: inline-grid;
      min-width: 23px;
      height: 23px;
      padding: 0 5px;
      place-items: center;
      border: 1px solid #2a3642;
      border-radius: 6px;
      color: #b8c4cd;
      background: #121922;
      font-family: inherit;
      font-size: 11px;
      line-height: 1;
    }

    .mobile-controls {
      display: none;
      grid-template: repeat(2, 44px) / repeat(3, 48px);
      justify-content: center;
      gap: 6px;
      margin: 17px auto 0;
      touch-action: manipulation;
    }

    .mobile-controls button {
      display: grid;
      place-items: center;
      border: 1px solid #293541;
      border-radius: 11px;
      color: #c9d5dc;
      background: #111922;
      cursor: pointer;
      font-size: 18px;
    }

    .mobile-controls button:active { color: var(--mint); background: #18252a; }
    .mobile-controls button:nth-child(1) { grid-column: 2; grid-row: 1; }
    .mobile-controls button:nth-child(2) { grid-column: 1; grid-row: 2; }
    .mobile-controls button:nth-child(3) { grid-column: 2; grid-row: 2; }
    .mobile-controls button:nth-child(4) { grid-column: 3; grid-row: 2; }

    @media (max-width: 620px) {
      .app { width: min(100% - 28px, 540px); padding-top: 27px; }
      .topbar { margin-bottom: 18px; }
      .brand { gap: 10px; }
      .brand-mark { width: 38px; height: 38px; }
      .score-card { min-width: 75px; padding: 9px 10px 8px; }
      .score-value { font-size: 17px; }
      .canvas-wrap { aspect-ratio: 1.08; }
      .game-frame { padding: 6px; border-radius: 15px; }
      .mobile-controls { display: grid; }
      .footer { padding-top: 13px; font-size: 11px; }
      .key-hints { display: none; }
    }

    @media (max-width: 380px) {
      .subtitle { font-size: 12px; }
      .score-card { min-width: 68px; }
      .footer { font-size: 10px; }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --page: #10151a;
        --panel: #151c23;
        --panel-raised: #1a232b;
        --line: #29343e;
        --muted: #9aa7b2;
      }
      body { background-color: var(--page); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 7h8a3 3 0 0 1 3 3v1a3 3 0 0 0 3 3h.5M5 17h5a3 3 0 0 0 3-3v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="5" cy="7" r="1.5" fill="currentColor"/><circle cx="19.5" cy="14" r="1.5" fill="currentColor"/><circle cx="5" cy="17" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>Neon Snake</h1>
          <p class="subtitle">A little arcade, right here.</p>
        </div>
      </div>
      <div class="scores" aria-label="Game scores">
        <div class="score-card">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">00</span>
        </div>
        <div class="score-card">
          <span class="score-label">Best</span>
          <span class="score-value" id="best">00</span>
        </div>
      </div>
    </header>

    <section class="game-frame" aria-label="Snake game">
      <div class="canvas-wrap">
        <canvas id="game" aria-label="Snake game board. Use the arrow keys or WASD to move." role="img"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card" role="status" aria-live="polite">
            <div class="overlay-icon" id="overlay-icon" aria-hidden="true">↗</div>
            <h2 id="overlay-title">Ready when you are</h2>
            <p id="overlay-copy">Collect the glowing orbs. Don't run into yourself—or the edge.</p>
            <button class="primary-button" id="start-button" type="button"><span aria-hidden="true">▶</span> Start game</button>
          </div>
        </div>
      </div>
    </section>

    <div class="mobile-controls" aria-label="Touch controls">
      <button type="button" aria-label="Move up" data-direction="up">↑</button>
      <button type="button" aria-label="Move left" data-direction="left">←</button>
      <button type="button" aria-label="Move down" data-direction="down">↓</button>
      <button type="button" aria-label="Move right" data-direction="right">→</button>
    </div>

    <footer class="footer">
      <span class="key-hints"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span>or WASD to move</span></span>
      <span id="status-text">Press a direction or start to play</span>
      <span>Space to pause</span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const wrap = document.querySelector(".canvas-wrap");
      const overlay = document.querySelector("#overlay");
      const overlayIcon = document.querySelector("#overlay-icon");
      const overlayTitle = document.querySelector("#overlay-title");
      const overlayCopy = document.querySelector("#overlay-copy");
      const startButton = document.querySelector("#start-button");
      const scoreDisplay = document.querySelector("#score");
      const bestDisplay = document.querySelector("#best");
      const statusText = document.querySelector("#status-text");

      const columns = 30;
      const rows = 20;
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake;
      let food;
      let direction;
      let nextDirection;
      let score = 0;
      let best = 0;
      let recordThisRun = false;
      let speed = 145;
      let state = "ready";
      let lastStep = 0;
      let board = { x: 0, y: 0, cell: 0 };
      let width = 0;
      let height = 0;

      try {
        best = Number(localStorage.getItem("neon-snake-best")) || 0;
      } catch {
        best = 0;
      }
      bestDisplay.textContent = String(best).padStart(2, "0");

      function resetGame() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = directions.right;
        nextDirection = direction;
        score = 0;
        recordThisRun = false;
        speed = 145;
        scoreDisplay.textContent = "00";
        food = placeFood();
      }

      function placeFood() {
        const openCells = [];
        for (let y = 0; y < rows; y += 1) {
          for (let x = 0; x < columns; x += 1) {
            if (!snake.some((part) => part.x === x && part.y === y)) openCells.push({ x, y });
          }
        }
        return openCells[Math.floor(Math.random() * openCells.length)];
      }

      function setOverlay(title, copy, buttonText, icon) {
        overlayTitle.textContent = title;
        overlayCopy.textContent = copy;
        startButton.innerHTML = `<span aria-hidden="true">${icon === "restart" ? "↻" : "▶"}</span> ${buttonText}`;
        overlayIcon.textContent = icon === "over" ? "✦" : icon === "pause" ? "Ⅱ" : "↗";
        overlay.hidden = false;
      }

      function startGame() {
        if (state === "over") resetGame();
        state = "playing";
        lastStep = performance.now();
        overlay.hidden = true;
        statusText.textContent = "Stay sharp — it gets faster as you grow";
      }

      function pauseGame() {
        if (state !== "playing") return;
        state = "paused";
        setOverlay("Take a breather", "Your run is paused. Pick up right where you left off.", "Resume game", "pause");
        statusText.textContent = "Game paused";
      }

      function togglePause() {
        if (state === "playing") pauseGame();
        else if (state === "paused") startGame();
      }

      function endGame() {
        state = "over";
        statusText.textContent = "Run ended";
        setOverlay("Game over", `You scored ${score} ${score === 10 ? "point" : "points"}. ${recordThisRun ? "New personal best!" : "Ready for another run?"}`, "Play again", "over");
      }

      function setDirection(name) {
        const candidate = directions[name];
        if (!candidate || (state !== "playing" && state !== "ready")) return;
        if (candidate.x + direction.x === 0 && candidate.y + direction.y === 0) return;
        nextDirection = candidate;
        if (state === "ready") startGame();
      }

      function step() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const eating = head.x === food.x && head.y === food.y;
        const body = eating ? snake : snake.slice(0, -1);
        if (head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows ||
            body.some((part) => part.x === head.x && part.y === head.y)) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 10;
          scoreDisplay.textContent = String(score).padStart(2, "0");
          if (score > best) {
            best = score;
            recordThisRun = true;
            bestDisplay.textContent = String(best).padStart(2, "0");
            try {
              localStorage.setItem("neon-snake-best", String(best));
            } catch {
              // Keep the in-memory best score if storage is unavailable.
            }
          }
          speed = Math.max(66, speed - 6);
          food = placeFood();
        } else {
          snake.pop();
        }

        if (!food) {
          state = "over";
          statusText.textContent = "Board cleared";
          setOverlay("Board cleared!", `Incredible run — you scored ${score} points.`, "Play again", "over");
        }
      }

      function resizeCanvas() {
        const bounds = wrap.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        const cell = Math.min(width / columns, height / rows);
        board = {
          cell,
          x: (width - columns * cell) / 2,
          y: (height - rows * cell) / 2
        };
        draw();
      }

      function draw() {
        if (!width || !height) return;
        context.clearRect(0, 0, width, height);
        context.fillStyle = "#080e13";
        context.fillRect(0, 0, width, height);

        context.strokeStyle = "rgba(129, 165, 178, .075)";
        context.lineWidth = 1;
        context.beginPath();
        for (let x = 0; x <= columns; x += 1) {
          const lineX = board.x + x * board.cell;
          context.moveTo(Math.round(lineX) + .5, board.y);
          context.lineTo(Math.round(lineX) + .5, board.y + rows * board.cell);
        }
        for (let y = 0; y <= rows; y += 1) {
          const lineY = board.y + y * board.cell;
          context.moveTo(board.x, Math.round(lineY) + .5);
          context.lineTo(board.x + columns * board.cell, Math.round(lineY) + .5);
        }
        context.stroke();

        if (!snake) return;
        const cell = board.cell;
        const inset = Math.max(2, cell * .12);

        if (food) {
          const pulse = 1 + Math.sin(performance.now() / 210) * .08;
          const foodX = board.x + (food.x + .5) * cell;
          const foodY = board.y + (food.y + .5) * cell;
          context.save();
          context.shadowColor = "#ff5f91";
          context.shadowBlur = cell * .85;
          context.fillStyle = "#ff5f91";
          context.beginPath();
          context.arc(foodX, foodY, cell * .26 * pulse, 0, Math.PI * 2);
          context.fill();
          context.shadowBlur = 0;
          context.fillStyle = "#ffd0dd";
          context.beginPath();
          context.arc(foodX - cell * .07, foodY - cell * .08, cell * .07, 0, Math.PI * 2);
          context.fill();
          context.restore();
        }

        snake.forEach((part, index) => {
          const x = board.x + part.x * cell + inset;
          const y = board.y + part.y * cell + inset;
          const size = cell - inset * 2;
          const ratio = index / Math.max(1, snake.length - 1);
          context.fillStyle = index === 0 ? "#6df7c1" : `hsl(${158 + ratio * 21} 79% ${57 - ratio * 11}%)`;
          if (index === 0) {
            context.save();
            context.shadowColor = "#6df7c1";
            context.shadowBlur = cell * .62;
          }
          context.beginPath();
          context.roundRect(x, y, size, size, Math.max(3, cell * .22));
          context.fill();
          if (index === 0) {
            context.restore();
            drawEyes(x, y, size, cell);
          }
        });
      }

      function drawEyes(x, y, size, cell) {
        const eyeRadius = Math.max(1.3, cell * .055);
        const forward = size * .23;
        const side = size * .24;
        let eyes;
        if (direction.x === 1) eyes = [[x + size - forward, y + side], [x + size - forward, y + size - side]];
        else if (direction.x === -1) eyes = [[x + forward, y + side], [x + forward, y + size - side]];
        else if (direction.y === -1) eyes = [[x + side, y + forward], [x + size - side, y + forward]];
        else eyes = [[x + side, y + size - forward], [x + size - side, y + size - forward]];
        context.fillStyle = "#08221a";
        eyes.forEach(([eyeX, eyeY]) => {
          context.beginPath();
          context.arc(eyeX, eyeY, eyeRadius, 0, Math.PI * 2);
          context.fill();
        });
      }

      function animate(now) {
        if (state === "playing" && now - lastStep >= speed) {
          step();
          lastStep = now;
        }
        draw();
        requestAnimationFrame(animate);
      }

      startButton.addEventListener("click", () => {
        if (state === "over") resetGame();
        startGame();
      });

      document.querySelectorAll("[data-direction]").forEach((button) => {
        button.addEventListener("click", () => setDirection(button.dataset.direction));
      });

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        const keyMap = {
          arrowup: "up", w: "up",
          arrowdown: "down", s: "down",
          arrowleft: "left", a: "left",
          arrowright: "right", d: "right"
        };
        if (keyMap[key]) {
          event.preventDefault();
          setDirection(keyMap[key]);
        } else if (event.code === "Space" && !(event.target instanceof HTMLButtonElement)) {
          event.preventDefault();
          if (state === "ready") startGame();
          else if (state === "over") {
            resetGame();
            startGame();
          } else togglePause();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "playing") pauseGame();
      });

      resetGame();
      new ResizeObserver(resizeCanvas).observe(wrap);
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
